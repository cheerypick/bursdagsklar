name: Deploy web to GitHub Pages

# One-time setup in the repo: Settings → Pages → Build and deployment → Source: "GitHub Actions",
# Custom domain: bursdagsklar.no (DNS: apex A records to GitHub Pages, www CNAME to cheerypick.github.io).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Custom domain: the site lives at the domain root, so the base path is empty.
      # public/CNAME (copied into dist) keeps bursdagsklar.no set on every deploy.
      - name: Export web for https://bursdagsklar.no/
        run: npm run export:web
        env:
          EXPO_BASE_URL:
          EXPO_NO_TELEMETRY: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
