name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Export web
        run: npm run export:web
        env:
          EXPO_BASE_URL: ''
          EXPO_NO_TELEMETRY: 1
      # Safari on every iPhone is WebKit; a page once rendered in Chromium and stayed
      # blank in Safari. The e2e flow runs in both engines, at phone and desktop width.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit chromium
      - name: E2E (WebKit + Chromium)
        run: npm run export:web && npm run e2e
        env:
          EXPO_NO_TELEMETRY: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
